name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate JSON
        run: |
          python3 -m json.tool opencode.json > /dev/null
          python3 -m json.tool cli.json > /dev/null

      - name: compile and self-test Python
        run: |
          python3 -m compileall -q skills
          python3 skills/drawio/scripts/selftest.py
          python3 skills/humanize/scripts/selftest.py
          python3 skills/zotero/scripts/selftest.py
          python3 skills/commit/scripts/selftest.py
          python3 skills/write-docs/scripts/selftest.py
          python3 skills/security-review/scripts/selftest.py

      - name: check layout
        run: |
          test -f opencode.json
          test -f cli.json
          test -f agents/tutor.md
          test -f commands/learn.md
          test -f learned/preferences.md
          for skill in skills/*/; do
            test -f "$skill/SKILL.md" || { echo "missing SKILL.md: $skill"; exit 1; }
          done
          if find . -name '*.ps1' | grep -q .; then
            echo "PowerShell scripts are not allowed"; exit 1
          fi

      - name: no Claude-only references
        run: |
          if grep -rnE 'claude -p|\.claude/|mcp__[Cc]laude|ANTHROPIC_API_KEY|present_files' \
            skills --include='*.md' --include='*.py' --include='*.js' --include='*.html'; then
            echo "Claude-only reference found"; exit 1
          fi
