name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck -x skills/*/scripts/*.sh

      - name: validate JSON
        run: |
          python3 -m json.tool opencode.json > /dev/null
          python3 -m json.tool skills/parallel-agents/config.json > /dev/null

      - name: compile and self-test Python
        run: |
          python3 -m compileall -q skills
          python3 skills/drawio/scripts/selftest.py

      - name: check layout
        run: |
          test -f agents/parallel-agent.md
          test -f opencode.json
          for skill in skills/*/; do
            test -f "$skill/SKILL.md" || { echo "missing SKILL.md: $skill"; exit 1; }
          done
          if find . -name '*.ps1' | grep -q .; then
            echo "PowerShell scripts are not allowed"; exit 1
          fi

      - name: no built-in duplicates
        run: |
          for skill in docx pdf pptx xlsx skill-creator; do
            if [ -d "skills/$skill" ]; then
              echo "skills/$skill duplicates an OpenCode built-in"; exit 1
            fi
          done
